services:
  ros_workshop:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    image: ros_workshop:jazzy
    container_name: ros_workshop

    network_mode: host
    ipc: host
    init: true

    volumes:
      - ..:/root/workshop_ws/src
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=/tmp/runtime-root
      # Um ID por computador: evita que uma dupla comande o robô da bancada vizinha
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - LIBGL_DRI3_DISABLE=1
      # Descomente se o Gazebo abrir com tela preta (máquina sem aceleração gráfica)
      # - LIBGL_ALWAYS_SOFTWARE=1

    devices:
      - /dev/dri:/dev/dri

    stdin_open: true
    tty: true
    privileged: true
