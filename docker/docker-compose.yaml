services:
  ros_workshop:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      network: host

    container_name: ros_workshop

    network_mode: host

    #gpus: all

    init: true

    volumes:
      - ..:/root/workshop_ws/src
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp/.docker.xauth:/tmp/.docker.xauth:rw
      - /etc/localtime:/etc/localtime:ro
      - /dev/input:/dev/input

    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=/tmp/runtime-developer
      - XAUTHORITY=/tmp/.docker.xauth
      - ROS_DOMAIN_ID=12
      - MESA_GL_VERSION_OVERRIDE=4.5 
      - MESA_GLSL_VERSION_OVERRIDE=450 


    devices:
      - "/dev/dri"

    stdin_open: true
    tty: true
    privileged: true